<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인</title>

  <link rel="stylesheet" href="./login.css">
  <script src="./login.js" defer></script>
</head>
<body>
  <div class="top-bar">
    <a href="./play.html" class="main-logo">
      <img src="./image/logo.png" alt="Acting Lesson 로고">
    </a>
    <div class="top-menu">
      <a href="./login.html">로그인</a>
      <span>|</span>
      <a href="./signup.html">회원가입</a>
    </div>    
  </div>

  <header>
    <h1>김지환 Acting Lesson</h1>
    <p>로그인 후 더 편리하게 이용하세요</p>
  </header>

  <section class="login-section">

    <div class="login-box">

      <h2>로그인</h2>

      <form id="loginForm">
        <input 
          type="email"
          id="email"
          name="email"
          placeholder="이메일"
          required>

        <div class="password-wrap">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="비밀번호"
            required>
          <img src="./resource/eye.png" id="togglePassword" alt="비밀번호 보기">
        </div>

        <div class="login-option">
          <label class="keep-login">
            <input type="checkbox" id="keepLogin">로그인 상태 유지</label>

          <div class="find-link">
            <a href="./find_email.html">이메일 찾기</a>
            <span>|</span>
            <a href="./find_password.html">비밀번호 찾기</a>
          </div>
        </div>
          
        <button type="submit" class="login-btn">로그인</button>
      </form>

      <div class="divider">또는 간편로그인</div>

      <div class="social-icons">
        <button class="social kakao-btn">
          <img src="./resource/kakao.png" alt="카카오">
        </button>

        <button class="social naver-btn">
          <img style="border-radius: 10%;" src="./resource/naver.png" alt="네이버">
        </button>

        <button class="social google-btn">
          <img src="./resource/google.png" alt="구글">
        </button>
      </div>

      <p class="signup-link">
        아직 회원이 아니신가요?
        <a href="./signup.html">회원가입</a>
      </p>
    </div>
  </section> 
</body>
</html>
